<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bubblegame</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🫧</text></svg>" />
  <style>
    :root { --bg: #0d0820; --ink: #e9e4ff; --accent: #a8f0c6; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #0d0820;
      color: var(--ink);
      font-family: "Courier New", monospace;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100%; padding: 10px; gap: 10px; touch-action: manipulation;
    }
    h1 { margin: 2px 0 0; letter-spacing: 4px; color: var(--accent);
         text-shadow: 2px 2px 0 #4f2d8a; font-size: 20px; }
    .wrap {
      image-rendering: pixelated; image-rendering: crisp-edges;
      border: 4px solid #4f2d8a; border-radius: 8px;
      box-shadow: 0 0 0 4px #1a0f33; background: #120a26;
      max-width: 100%;
    }
    canvas#game {
      display: block; width: 768px; height: 672px;   /* 256x224 * 3 */
      max-width: 100%; height: auto; aspect-ratio: 256 / 224;
      image-rendering: pixelated; touch-action: none;
    }
    .hint { color: #bfe3ff; font-size: 12px; opacity: .8; text-align: center; }
    .links a { color: #ffd23f; text-decoration: none; margin: 0 10px; }
    .links a:hover { color: #fff1a6; }

    /* ---- on-screen touch controls (sized with vw so they fit any phone) ---- */
    #pad { display: none; position: relative; width: 100%; max-width: 768px;
           justify-content: space-between; align-items: center;
           user-select: none; -webkit-user-select: none; touch-action: none; padding: 0 6px; }
    #pad.show { display: flex; }
    .cluster { display: flex; gap: clamp(10px, 3vw, 18px); align-items: center; }
    .btn {
      width: clamp(54px, 17vw, 76px); height: clamp(54px, 17vw, 76px); border-radius: 50%;
      border: 3px solid #6a44c0; background: #2c1a5c; color: #e9e4ff;
      font-size: clamp(22px, 7vw, 32px); font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none; box-shadow: 0 4px 0 #1a0f33;
      transition: transform .04s, background .04s;
    }
    .btn.held { background: #5a39c0; transform: translateY(3px); box-shadow: 0 1px 0 #1a0f33; }
    .btn.fire { background: #2a7d57; border-color: #36c98f; }
    .btn.fire.held { background: #41a877; }
    /* restart: small, centred between the thumb clusters, out of the way */
    .btn.small.restart { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: clamp(40px, 11vw, 50px); height: clamp(40px, 11vw, 50px); font-size: clamp(16px, 5vw, 20px); opacity: .8; }
    .btn.small.restart.held { transform: translate(-50%, -50%) scale(.92); }
  </style>
</head>
<body>
  <h1>🫧 BUBBLEGAME</h1>
  <div class="wrap"><canvas id="game"></canvas></div>

  <div id="pad">
    <div class="cluster">
      <div class="btn" data-act="left">◀</div>
      <div class="btn" data-act="down">▼</div>
      <div class="btn" data-act="right">▶</div>
    </div>
    <div class="btn small restart" data-act="restart">↻</div>
    <div class="cluster">
      <div class="btn fire" data-act="fire">●</div>
      <div class="btn" data-act="jump">▲</div>
    </div>
  </div>

  <div class="hint">←/→ move &nbsp;·&nbsp; ↑ / Space jump &nbsp;·&nbsp; ↓+jump drop &nbsp;·&nbsp; Z / J bubble &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; R restart</div>
  <div class="links">
    <a href="tools/sprite-editor.html">🎨 Sprite Editor</a>
    <a href="tools/map-editor.html">🗺️ Map Editor</a>
    <a href="#" id="mute" title="toggle sound">🔊 Sound</a>
  </div>

  <!-- classic scripts (no bundler) so this runs by just opening the file -->
  <script src="js/palette.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>

  <script>
    // ---- multi-touch virtual gamepad ----------------------------------
    // Instead of per-button enter/leave (which drops input the moment your
    // thumb drifts), we track every active pointer, hit-test which button
    // it's over each move, and drive the held inputs from the union. This
    // makes it slide-friendly (roll thumb ◀↔▶) and fully multi-touch
    // (hold a direction + jump + fire at the same time).
    const pad = document.getElementById('pad');
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                    window.matchMedia('(pointer: coarse)').matches;
    if (isTouch) pad.classList.add('show');

    const btns = [...pad.querySelectorAll('.btn')];
    const HOLD = ['left', 'right', 'down', 'jump', 'fire'];
    const pointers = new Map(); // pointerId -> held action

    function hitAct(x, y) {
      for (const b of btns) {
        const r = b.getBoundingClientRect();
        const pad6 = 8; // fat-finger forgiveness
        if (x >= r.left - pad6 && x <= r.right + pad6 && y >= r.top - pad6 && y <= r.bottom + pad6)
          return b.dataset.act;
      }
      return null;
    }
    function refresh() {
      const held = new Set(pointers.values());
      HOLD.forEach((a) => Input.setVirtual(a, held.has(a)));
      btns.forEach((b) => b.classList.toggle('held', held.has(b.dataset.act)));
    }
    function flash(act) {
      const b = btns.find((x) => x.dataset.act === act);
      if (b) { b.classList.add('held'); setTimeout(() => b.classList.remove('held'), 110); }
    }
    pad.addEventListener('pointerdown', (e) => {
      const a = hitAct(e.clientX, e.clientY);
      if (!a) return;
      e.preventDefault();
      if (a === 'restart') { Input.pulse('restart'); flash('restart'); return; }
      try { pad.setPointerCapture(e.pointerId); } catch (_) {} // keep moves even if finger leaves the button
      pointers.set(e.pointerId, a);
      refresh();
    });
    pad.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return; // only pointers we're tracking
      e.preventDefault();
      const a = hitAct(e.clientX, e.clientY);
      if (a && a !== 'restart') pointers.set(e.pointerId, a);
      else pointers.delete(e.pointerId);
      refresh();
    });
    const lift = (e) => { if (pointers.delete(e.pointerId)) refresh(); };
    pad.addEventListener('pointerup', lift);
    pad.addEventListener('pointercancel', lift);

    // Tap the screen to start / confirm (title, win, game-over).
    document.getElementById('game').addEventListener('pointerdown', () => Input.pulse('start'));

    // Sound toggle link (works on desktop + mobile; game's M key does the same).
    const muteLink = document.getElementById('mute');
    const muteLabel = () => { muteLink.textContent = Sfx.muted ? '🔇 Muted' : '🔊 Sound'; };
    muteLink.addEventListener('click', (e) => { e.preventDefault(); Sfx.toggle(); muteLabel(); });
    muteLabel();
  </script>
</body>
</html>
