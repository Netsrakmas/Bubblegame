<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bubblegame</title>
  <style>
    :root { --bg: #0d0820; --ink: #e9e4ff; --accent: #a8f0c6; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #0d0820;
      color: var(--ink);
      font-family: "Courier New", monospace;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100%; padding: 10px; gap: 10px; touch-action: manipulation;
    }
    h1 { margin: 2px 0 0; letter-spacing: 4px; color: var(--accent);
         text-shadow: 2px 2px 0 #4f2d8a; font-size: 20px; }
    .wrap {
      image-rendering: pixelated; image-rendering: crisp-edges;
      border: 4px solid #4f2d8a; border-radius: 8px;
      box-shadow: 0 0 0 4px #1a0f33; background: #120a26;
      max-width: 100%;
    }
    canvas#game {
      display: block; width: 768px; height: 672px;   /* 256x224 * 3 */
      max-width: 100%; height: auto; aspect-ratio: 256 / 224;
      image-rendering: pixelated; touch-action: none;
    }
    .hint { color: #bfe3ff; font-size: 12px; opacity: .8; text-align: center; }
    .links a { color: #ffd23f; text-decoration: none; margin: 0 10px; }
    .links a:hover { color: #fff1a6; }

    /* ---- on-screen touch controls ---- */
    #pad { display: none; width: 100%; max-width: 768px;
           justify-content: space-between; align-items: center; gap: 14px;
           user-select: none; -webkit-user-select: none; touch-action: none; }
    #pad.show { display: flex; }
    .cluster { display: flex; gap: 14px; }
    .btn {
      width: 66px; height: 66px; border-radius: 50%;
      border: 3px solid #6a44c0; background: #2c1a5c; color: #e9e4ff;
      font-size: 26px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none; box-shadow: 0 4px 0 #1a0f33;
    }
    .btn:active, .btn.held { background: #4a2e9c; transform: translateY(3px); box-shadow: 0 1px 0 #1a0f33; }
    .btn.fire { background: #2a7d57; border-color: #36c98f; }
    .btn.fire.held { background: #38a06f; }
    .btn.small { width: 48px; height: 48px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🫧 BUBBLEGAME</h1>
  <div class="wrap"><canvas id="game"></canvas></div>

  <div id="pad">
    <div class="cluster">
      <div class="btn" data-act="left">◀</div>
      <div class="btn" data-act="right">▶</div>
    </div>
    <div class="cluster">
      <div class="btn small" data-act="restart">↻</div>
      <div class="btn fire" data-act="fire">●</div>
      <div class="btn" data-act="jump">▲</div>
    </div>
  </div>

  <div class="hint">←/→ move &nbsp;·&nbsp; ↑ / Space jump &nbsp;·&nbsp; Z / J fire bubble &nbsp;·&nbsp; R restart &nbsp;·&nbsp; or use the buttons</div>
  <div class="links">
    <a href="tools/sprite-editor.html">🎨 Sprite Editor</a>
    <a href="tools/map-editor.html">🗺️ Map Editor</a>
  </div>

  <!-- classic scripts (no bundler) so this runs by just opening the file -->
  <script src="js/palette.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>

  <script>
    // Show touch controls on touch-capable / coarse-pointer devices.
    const pad = document.getElementById('pad');
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                    window.matchMedia('(pointer: coarse)').matches;
    if (isTouch) pad.classList.add('show');

    // Wire each button to the game's virtual input via pointer events.
    pad.querySelectorAll('.btn').forEach((b) => {
      const act = b.dataset.act;
      const press = (e) => { e.preventDefault();
        if (act === 'restart') Input.pulse('restart');
        else Input.setVirtual(act, true);
        b.classList.add('held'); };
      const release = (e) => { e.preventDefault();
        if (act !== 'restart') Input.setVirtual(act, false);
        b.classList.remove('held'); };
      b.addEventListener('pointerdown', press);
      b.addEventListener('pointerup', release);
      b.addEventListener('pointercancel', release);
      b.addEventListener('pointerleave', release);
    });

    // Tap the screen to start / confirm (title, win, game-over).
    const cv = document.getElementById('game');
    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); Input.pulse('start'); });
  </script>
</body>
</html>
